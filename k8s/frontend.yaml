apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: suilens-2206027021
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: suilens/frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
          env:
            - name: VITE_CATALOG_API
              value: http://catalog-service:3001
            - name: VITE_ORDER_API
              value: http://order-service:3002
            - name: VITE_NOTIFICATION_WS
              value: ws://notification-service:3003/ws
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: suilens-2206027021
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30080
